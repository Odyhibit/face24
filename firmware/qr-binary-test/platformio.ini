; qr-binary-test: checks that Module13.2 QRCode passes raw binary QR payloads through unchanged.
; Scan qr_out/seq_256.png (every byte value) and the rand_*.png codes; PASS/FAIL on screen,
; hex dump on USB serial. Regenerate the codes with: python3 make_test_qr.py  (needs segno)
;
; Pins: probes Core2 G13/G14 in both directions (module jumpers #3).
[platformio]
src_dir      = .
default_envs = m5stack-core2

[env:m5stack-core2]
platform      = espressif32@6.7.0
board         = m5stack-core2
framework     = arduino
monitor_speed = 115200
build_flags   = -DCORE_DEBUG_LEVEL=0
; M5Unified 0.3.x changed the PI4IOE5V6408 API the QR library uses; pin 0.2.17.
lib_deps      =
    m5stack/M5Unified@0.2.17
    symlink://../lib/M5Module-QRCode
