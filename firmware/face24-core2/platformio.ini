; face24-core2: scan a face24 QR code and show the face (M5Stack Core2 + Module13.2 QRCode)
;
; 1. python3 tools/make_device_models.py   (writes data/models.bin and src/testvectors.h from this repo's web/)
; 2. Flash the models once (see README.md), then:  pio run -t upload

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform               = espressif32@6.7.0
board                  = m5stack-core2
framework              = arduino
monitor_speed          = 115200
upload_speed           = 921600
board_build.partitions = partitions.csv
build_flags            = -DCORE_DEBUG_LEVEL=0
; M5Unified 0.3.x changed the PI4IOE5V6408 API the QR library uses; pin 0.2.17.
lib_deps               =
    m5stack/M5Unified@0.2.17
    symlink://../lib/M5Module-QRCode
    symlink://../face24-lib
