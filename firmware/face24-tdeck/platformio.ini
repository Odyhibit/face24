; face24-tdeck: receive face24 payloads from the Core2 scanner over ESP-NOW, decode, display.
; LilyGo T-Deck Plus (ESP32-S3, 16 MB flash, 8 MB octal PSRAM).
;
; Build:   pio run          -> .pio/build/tdeck/firmware.bin (app-only image, for the SD-card Launcher)
; Models:  copy ../face24-core2/data/models.bin to the SD card as /face24/models.bin
; Or flash over USB:  pio run -t upload

[platformio]
default_envs = tdeck

[env:tdeck]
platform                        = espressif32@6.7.0
board                           = esp32-s3-devkitc-1
framework                       = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
monitor_speed                   = 115200
build_flags                     =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps                        =
    lovyan03/LovyanGFX@1.1.16
    symlink://../face24-lib

; Same firmware, plus a boot self-test: decodes the PyTorch test vectors for all three codecs,
; shows PASS/FAIL and timings, and prints per-layer timings over USB. Flash over USB:
;   pio run -e tdeck-selftest -t upload && pio device monitor
[env:tdeck-selftest]
extends     = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -DFACE24_SELF_TEST=1
    -DFACE24_PROFILE=1
    -I../face24-core2/src
